<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedDelivery API CORS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>MedDelivery API CORS Test</h1>
    
    <div class="test-section">
        <h2>Configuration</h2>
        <label>API Base URL:</label>
        <input type="text" id="apiUrl" value="https://med-delivery-system-be-production.up.railway.app">
    </div>

    <div class="test-section">
        <h2>Test 1: Health Check (GET)</h2>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="healthResult" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: API Health Check (GET)</h2>
        <button onclick="testApiHealth()">Test API Health Endpoint</button>
        <div id="apiHealthResult" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Register (POST)</h2>
        <label>Full Name:</label>
        <input type="text" id="fullName" value="Test User">
        <label>Email:</label>
        <input type="email" id="email" value="test@example.com">
        <button onclick="testRegister()">Test Register Endpoint</button>
        <div id="registerResult" class="result"></div>
    </div>

    <script>
        function getApiUrl() {
            return document.getElementById('apiUrl').value;
        }

        function displayResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = isError ? 'result error' : 'result success';
        }

        async function testHealth() {
            const resultDiv = document.getElementById('healthResult');
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';

            try {
                const response = await fetch(`${getApiUrl()}/health`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                displayResult('healthResult', {
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                }, !response.ok);
            } catch (error) {
                displayResult('healthResult', {
                    error: error.message,
                    type: error.name
                }, true);
            }
        }

        async function testApiHealth() {
            const resultDiv = document.getElementById('apiHealthResult');
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';

            try {
                const response = await fetch(`${getApiUrl()}/api/health`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                displayResult('apiHealthResult', {
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                }, !response.ok);
            } catch (error) {
                displayResult('apiHealthResult', {
                    error: error.message,
                    type: error.name
                }, true);
            }
        }

        async function testRegister() {
            const resultDiv = document.getElementById('registerResult');
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;

            try {
                const response = await fetch(`${getApiUrl()}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fullName: fullName,
                        email: email
                    })
                });

                const data = await response.json();
                displayResult('registerResult', {
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                }, !response.ok);
            } catch (error) {
                displayResult('registerResult', {
                    error: error.message,
                    type: error.name,
                    note: 'This is likely a CORS error. Check browser console for details.'
                }, true);
            }
        }

        // Auto-test on load
        window.onload = function() {
            console.log('CORS Test Page Loaded');
            console.log('Open browser DevTools (F12) to see network requests');
        };
    </script>
</body>
</html>
