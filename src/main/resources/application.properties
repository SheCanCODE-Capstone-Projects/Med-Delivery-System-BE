#APPLICATION

spring.application.name=meddelivery
server.port=8080
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO
logging.level.org.springframework.data.redis=WARN

# Load environment variables from .env file
#spring.config.import=optional:file:.env

#DATABASE

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#FLYWAY MIGRATION

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.schemas=public


#REDIS

spring.data.redis.url=${REDIS_URL:}
spring.data.redis.ssl.enabled=true
spring.data.redis.repositories.enabled=false
spring.data.redis.timeout=60000ms
spring.data.redis.connect-timeout=60000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.shutdown-timeout=100ms


#JWT

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh.expiration=2592000000


#OTP

otp.expiration.minutes=5


#FIREBASE (PHONE OTP)

firebase.service.account.path=classpath:firebase-service-account.json


#EMAIL (OTP) - SMTP Configuration (COMMENTED OUT - Using SendGrid Web API instead)
# Uncomment below to rollback to SMTP if needed

# Gmail SMTP Configuration (Backup)
# spring.mail.host=smtp.gmail.com
