# spring.mail.properties.mail.smtp.connectiontimeout=10000
# spring.mail.properties.mail.smtp.timeout=10000
# spring.mail.properties.mail.smtp.writetimeout=10000

# SendGrid Web API Configuration (Active)
app.sendgrid.api-key=${SENDGRID_API_KEY}
app.mail.from=${MAIL_FROM:noreply@meddelivery.com}



#SWAGGER

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Force Swagger to use HTTPS in production
server.forward-headers-strategy=framework
springdoc.swagger-ui.disable-swagger-default-url=true


#OAUTH2

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/{registrationId}

#FRONTEND
app.frontend.url=${FRONTEND_URL:http://localhost:3000}


#RATE LIMITING

rate.limit.otp.send.max=3
rate.limit.otp.send.window.minutes=15
rate.limit.otp.verify.max=5
rate.limit.otp.verify.window.minutes=15


#HTTP CLIENT TIMEOUTS

app.http.connect-timeout=5000
app.http.read-timeout=30000


#WEBSOCKET

websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}


#AI PRESCRIPTION VALIDATION (AI Configuration - OpenAI)

app.ai.enabled=false
app.ai.openai-api-key=${OPENAI_API_KEY}
app.ai.model=gpt-4o-mini
#CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

#FILE UPLOAD
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads
