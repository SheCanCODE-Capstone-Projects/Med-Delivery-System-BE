name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "21"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Setup test properties
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/application.properties << 'EOF'
          spring.application.name=meddelivery-test
          server.port=8080
          spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
          spring.datasource.username=testuser
          spring.datasource.password=testpass
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          spring.flyway.enabled=true
          spring.flyway.locations=classpath:db/migration
          spring.data.redis.host=localhost
          spring.data.redis.port=6379
          jwt.secret=test-secret-key-for-testing
          jwt.expiration=86400000
          spring.mail.host=smtp.gmail.com
          spring.mail.port=587
          spring.mail.username=test@test.com
          spring.mail.password=testpass
          spring.security.oauth2.client.registration.google.client-id=test-client-id
          spring.security.oauth2.client.registration.google.client-secret=test-client-secret
          spring.servlet.multipart.enabled=true
          EOF

      - name: Run Flyway Migrate
        run: mvn flyway:migrate -DskipTests -Dflyway.url=jdbc:postgresql://localhost:5432/testdb -Dflyway.user=testuser -Dflyway.password=testpass

      - name: Run Maven Tests
        run: mvn test -B -DskipITs
        env:
          DB_URL: jdbc:postgresql://localhost:5432/testdb
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-testing
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: testpass
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: latest
          cache-from: type=gha

  deploy-railway:
    name: Deploy Railway
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Railway Deploy
        uses: railwayapp/action@v2
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment: production
